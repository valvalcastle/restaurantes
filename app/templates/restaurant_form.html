{% extends "base.html" %}
{% block title %}{{ "Editar" if restaurant else "Nuevo" }} restaurante{% endblock %}

{% block content %}
<a class="link back" href="{{ '/restaurants/' ~ restaurant.id if restaurant else '/' }}">Cancelar</a>

<h1>{{ "Editar restaurante" if restaurant else "Nuevo restaurante" }}</h1>

<form id="restaurant-form" class="form"
      data-mode="{{ 'edit' if restaurant else 'create' }}"
      {% if restaurant %}data-id="{{ restaurant.id }}"{% endif %}>

  <label>Nombre
    <input name="name" required maxlength="100" value="{{ restaurant.name if restaurant else '' }}">
  </label>

  <label>Categoría
    <input name="category" required maxlength="50" placeholder="Mexicana, Pizza, Mariscos..."
           value="{{ restaurant.category if restaurant else '' }}">
  </label>

  <label>Ciudad
    <input name="city" required maxlength="50" value="{{ restaurant.city if restaurant else '' }}">
  </label>

  <label>Precio
    <select name="price" required>
      {% for p in (1, 2, 3) %}
        <option value="{{ p }}" {% if restaurant and restaurant.price == p %}selected{% elif not restaurant and p == 2 %}selected{% endif %}>{{ p | price_label }}</option>
      {% endfor %}
    </select>
  </label>

  <label>URL de la imagen (opcional)
    <input name="photoUrl" type="url" maxlength="500" placeholder="https://..."
           value="{{ restaurant.photoUrl if restaurant and restaurant.photoUrl else '' }}">
  </label>

  <div class="actions">
    <button class="btn btn-primary" type="submit">{{ "Guardar cambios" if restaurant else "Crear restaurante" }}</button>
  </div>
</form>
{% endblock %}
