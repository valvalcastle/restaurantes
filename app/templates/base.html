<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FriendlyEats{% endblock %} | FriendlyEats</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">FriendlyEats</a>
      <nav class="nav" aria-label="Principal">
        <a href="/">Restaurantes</a>
        <a href="/restaurants/new">Agregar restaurante</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if flash %}
      <div class="message ok" role="status">{{ flash }}</div>
    {% endif %}
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">FriendlyEats, Sprint 1</div>
  </footer>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
